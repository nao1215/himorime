# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
# A runnable first suite. Replace git with the command you want to measure.
# Run: himorime validate himorime.yaml && himorime run himorime.yaml
