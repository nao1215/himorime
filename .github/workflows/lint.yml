name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A linter only sees the files that build for its GOOS, so every operating
  # system with its own files is a separate leg.
  golangci-lint:
    name: golangci-lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows, freebsd, openbsd, netbsd]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # golangci-lint-action runs with GOTOOLCHAIN=local; match go.mod.
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: go vet
        run: go vet ./...
      - name: gofmt
        if: matrix.goos == 'linux'
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml examples/github-actions/benchmark.yml examples/github-actions/comment.yml

  misspell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: misspell
        run: |
          git ls-files '*.go' '*.md' '*.yml' '*.yaml' '*.json' \
            | xargs go run github.com/golangci/misspell/cmd/misspell@v0.8.0 -locale US -error
