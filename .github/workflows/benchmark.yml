name: Benchmark

# himorime measuring itself: the dogfood suite in bench/ compares the pull
# request with its base. It is informational: shared runners are noisy, so
# this job never blocks a merge (continue-on-error) and is not a required
# check. The job summary shows the result.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: build himorime from this commit
        run: go build -o "$RUNNER_TEMP/himorime" .
      - name: compare with the base
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            "$RUNNER_TEMP/himorime" ci bench
          else
            "$RUNNER_TEMP/himorime" run bench --summary "$GITHUB_STEP_SUMMARY"
          fi
