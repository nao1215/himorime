name: Benchmark

# himorime measuring itself with the suite in bench/.
#
# The measuring himorime is a release installed by setup-himorime, not the
# code under review: a pull request that breaks measurement cannot judge its
# own performance, and the job exercises the action users install.
#
# On a pull request, `himorime ci` builds the base of the pull request in a
# temporary worktree and the head in the checkout, measures both in
# interleaved rounds on this runner, writes the comparison to the job summary,
# and fails the job on a regression confirmed with 95% confidence beyond the
# tolerance of the suite. A difference too close to call is inconclusive and
# does not fail it. Started by hand, the job measures the ref without
# comparing.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: nao1215/setup-himorime@30710690b8b2dc8c61df8bf289f5bb899af3fbfa # v0.1.2 + automatic comments
        with:
          version: v0.2.0
      - name: Compare the base with the head
        if: github.event_name == 'pull_request'
        run: himorime ci --output "$RUNNER_TEMP/himorime.json" --format json bench
      - name: Measure
        if: github.event_name != 'pull_request'
        run: himorime run --output "$RUNNER_TEMP/himorime.json" --format json --summary "$GITHUB_STEP_SUMMARY" bench
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: himorime-report
          path: ${{ runner.temp }}/himorime.json
          retention-days: 7
