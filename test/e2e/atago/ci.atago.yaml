# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/atago/main/schema/atago.schema.json
version: "1"

suite:
  name: himorime ci

# himorime ci with the GitHub Actions environment simulated by files in the
# workdir: an event payload whose base commit is the repository's HEAD, and a
# step summary file. Nothing talks to GitHub.
defaults:
  scenario:
    env:
      GIT_AUTHOR_NAME: himorime-e2e
      GIT_AUTHOR_EMAIL: e2e@example.com
      GIT_COMMITTER_NAME: himorime-e2e
      GIT_COMMITTER_EMAIL: e2e@example.com
      GIT_CONFIG_NOSYSTEM: "1"

scenarios:
  - name: a pull request compares with its base and writes the job summary
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_EVENT_NAME: pull_request
      GITHUB_EVENT_PATH: ${workdir}/event.json
      GITHUB_STEP_SUMMARY: ${workdir}/summary.md
    steps:
      - fixture: {file: repo/delay.txt, content: "30ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            suite: {name: pull request}
            build:
              command: [e2ehelper, copy, delay.txt, "$${artifact}"]
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep-from, "$${artifact}"]}
      - fixture: {file: summary.md, content: "output of an earlier step\n"}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run: {command: "e2ehelper event pull_request ${workdir}/repo ${workdir}/event.json"}
      - run: {command: git switch -q -c feature, cwd: repo}
      - fixture: {file: repo/README.md, content: "docs only\n"}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m docs, cwd: repo}
      - run:
          command: himorime ci
          cwd: repo
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^sleepy .* (PASS|INCONCLUSIVE)$"
            not_contains: "\x1b["
      - assert:
          stderr: {matches: "comparing base [0-9a-f]{12} \\([0-9a-f]{40}\\) with the working tree"}
      - assert:
          file:
            path: summary.md
            contains:
              - "output of an earlier step\n| Benchmark |"
              - "| Benchmark | Metric | Base | Head | Difference | Change | Interval | Confidence | Tolerance | Result | Reason | Rule |"
              - "| sleepy / app |"

  - name: ci exits 6 when a required RSS budget is below the floor
    only: {os: linux}
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_EVENT_NAME: pull_request
      GITHUB_EVENT_PATH: ${workdir}/event.json
    steps:
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            suite: {name: floor budget}
            defaults: {warmup: 1, runs: 10}
            benchmarks:
              - name: tiny
                metrics: {memory: true}
                commands: {tool: {command: ["true"]}}
                budget:
                  tool:
                    memory: {peak_rss: {max: "<= 1KiB"}}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run: {command: "e2ehelper event pull_request ${workdir}/repo ${workdir}/event.json"}
      - run:
          command: himorime ci --quiet --format json --output ${workdir}/result.json
          cwd: repo
      - assert:
          exit_code: 6
          stderr: {contains: "himorime: exit 6: a requested metric could not be measured or a required budget could not be assessed"}
      - assert:
          file:
            path: result.json
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].result", equals: "metric_error"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].status", equals: "skipped"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].reason", equals: "the peak RSS is at or below the measurement floor"}
              - {path: "$.summary.metric_error", equals: 1}
              - {path: "$.summary.exit_code", equals: 6}

  - name: a regression in a pull request exits 1 and says so in the summary
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_EVENT_NAME: pull_request
      GITHUB_EVENT_PATH: ${workdir}/event.json
      GITHUB_STEP_SUMMARY: ${workdir}/summary.md
    steps:
      - fixture: {file: repo/delay.txt, content: "30ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            suite: {name: pull request}
            build:
              command: [e2ehelper, copy, delay.txt, "$${artifact}"]
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep-from, "$${artifact}"]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run: {command: "e2ehelper event pull_request ${workdir}/repo ${workdir}/event.json"}
      - fixture: {file: repo/delay.txt, content: "200ms\n"}
      - run: {command: git -c commit.gpgsign=false commit -q -am slower, cwd: repo}
      - run:
          command: himorime ci --format json --output ${workdir}/result.json
          cwd: repo
      - assert:
          exit_code: 1
          stdout: {empty: true}
          stderr:
            contains: ["| Benchmark | Metric | Base | Head |", "REGRESSION", "| Rule | Statistic |", "| Seed |"]
            not_contains: ["Decision evidence", "<details>"]
      - assert:
          file:
            path: result.json
            json:
              - {path: "$.git.base_source", equals: "pull_request.base.sha"}
              - {path: "$.environment.ci", equals: "github-actions"}
              - {path: "$.summary.regression", equals: 1}
      - assert:
          file:
            path: summary.md
            contains: ["| Exit code | 1 |", "REGRESSION"]

  # The pull request that adopts himorime: its base has no suite directory,
  # so the working tree is measured alone and its budgets decide the result.
  - name: the pull request that adds a suite checks its budgets and reports the suite as new
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_EVENT_NAME: pull_request
      GITHUB_EVENT_PATH: ${workdir}/event.json
      GITHUB_STEP_SUMMARY: ${workdir}/summary.md
    steps:
      - fixture: {file: repo/README.md, content: "before himorime\n"}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run: {command: "e2ehelper event pull_request ${workdir}/repo ${workdir}/event.json"}
      - run: {command: git switch -q -c adopt, cwd: repo}
      - fixture:
          file: repo/bench/himorime.yaml
          content: |
            version: "1"
            suite: {name: adopted}
            defaults: {warmup: 0, runs: 1}
            benchmarks:
              - name: version
                commands:
                  app: {command: [e2ehelper, sleep, 40ms]}
                budget:
                  app: {median: "<= 1ms"}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m "add a suite", cwd: repo}
      - run:
          command: himorime ci bench
          cwd: repo
      - assert:
          exit_code: 1
          stdout:
            # The suite path uses the platform's separator.
            matches: "(?m)^suite: adopted \\(bench[/\\\\]himorime\\.yaml\\)\\r?\\nnew in this revision: bench does not exist in the base revision, so only this revision is measured and its budgets are checked\\r?$"
            contains: ["OVER BUDGET", "1 over budget · 1 benchmark · 1 suite new in this revision · seed "]
            not_contains: ["BASE", "CONFIDENCE"]
          stderr:
            matches: "(?m)^::notice file=bench[/\\\\]himorime\\.yaml,title=himorime%3A suite new in this revision::suite adopted: new in this revision: bench does not exist in the base revision"
            contains: "::error"
      - assert:
          file:
            path: summary.md
            contains:
              - "| Exit code | 1 |"
              - "| New suite | adopted |"
      - run:
          command: himorime ci --quiet --format json bench
          cwd: repo
      - assert:
          exit_code: 1
          stdout:
            json:
              - {path: "$.suites[0].new_in_head", equals: true}
              - {path: "$.suites[0].result", equals: "over_budget"}
              - {path: "$.suites[0].benchmarks", length: 1}
              - {path: "$.suites[0].benchmarks[0].commands[0].base", equals: null}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].status", equals: "fail"}
              - {path: "$.summary.new_suites", equals: 1}
              - {path: "$.summary.exit_code", equals: 1}
      # Within its budget, the new suite passes.
      - fixture:
          file: repo/bench/himorime.yaml
          content: |
            version: "1"
            suite: {name: adopted}
            defaults: {warmup: 0, runs: 1}
            benchmarks:
              - name: version
                commands:
                  app: {command: [e2ehelper, sleep, 1ms]}
                budget:
                  app: {median: "<= 10s"}
      - run:
          command: himorime ci --quiet --format json bench
          cwd: repo
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].new_in_head", equals: true}
              - {path: "$.suites[0].result", equals: "pass"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].status", equals: "pass"}
              - {path: "$.summary.new_suites", equals: 1}
              - {path: "$.summary.exit_code", equals: 0}

  - name: push and merge_group events use their own base fields
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_EVENT_PATH: ${workdir}/event.json
    steps:
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            suite: {name: events}
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: quick
                commands:
                  app: {command: [e2ehelper, sleep, 1ms]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run: {command: "e2ehelper event push ${workdir}/repo ${workdir}/event.json"}
      - run:
          command: himorime ci --quiet --format json
          cwd: repo
          env: {GITHUB_EVENT_NAME: push}
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.git.base_source", equals: "push before"}
      - run: {command: "e2ehelper event merge_group ${workdir}/repo ${workdir}/event.json"}
      - run:
          command: himorime ci --quiet --format json
          cwd: repo
          env: {GITHUB_EVENT_NAME: merge_group}
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.git.base_source", equals: "merge_group.base_sha"}

  - name: pull_request_target is refused before anything runs
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_EVENT_NAME: pull_request_target
      GITHUB_EVENT_PATH: ${workdir}/event.json
    steps:
      - fixture: {file: event.json, content: '{"pull_request":{"base":{"sha":"1111111111111111111111111111111111111111"}}}'}
      - fixture:
          file: himorime.yaml
          content: |
            version: "1"
            suite: {name: refused}
            benchmarks:
              - name: never
                commands:
                  app: {command: [e2ehelper, write, "$${root}/ran"]}
      - run:
          command: himorime ci
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: ["refusing to run for pull_request_target", "trigger the workflow on pull_request instead"]}
      - assert:
          file: {path: ran, exists: false}

  - name: without a base the error explains how to name one
    steps:
      - fixture:
          file: himorime.yaml
          content: |
            version: "1"
            suite: {name: no base}
            benchmarks:
              - name: never
                commands:
                  app: {command: [e2ehelper, sleep, 1ms]}
      - run:
          command: himorime ci
      - assert:
          exit_code: 3
          stderr: {contains: ["not running in GitHub Actions", "--against <ref>", "HIMORIME_BASE_REF"]}
      - run:
          command: himorime ci
          env:
            GITHUB_ACTIONS: "true"
            GITHUB_EVENT_NAME: schedule
      - assert:
          exit_code: 3
          stderr: {contains: 'event "schedule" has no base commit'}

  - name: a base commit missing from a shallow clone points at fetch-depth
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_EVENT_NAME: pull_request
      GITHUB_EVENT_PATH: ${workdir}/event.json
    steps:
      - fixture: {file: event.json, content: '{"pull_request":{"base":{"sha":"1111111111111111111111111111111111111111"}}}'}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            suite: {name: shallow}
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: quick
                commands:
                  app: {command: [e2ehelper, sleep, 1ms]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime ci
          cwd: repo
      - assert:
          exit_code: 4
          stderr: {contains: "fetch-depth: 0"}

  - name: locally, HIMORIME_BASE_REF or --against name the base
    steps:
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            suite: {name: local}
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: quick
                commands:
                  app: {command: [e2ehelper, sleep, 1ms]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime ci --quiet --format json
          cwd: repo
          env: {HIMORIME_BASE_REF: main}
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.git.base_source", equals: "HIMORIME_BASE_REF"}
      - run:
          command: himorime ci --quiet --against main --summary ${workdir}/local-summary.md
          cwd: repo
      - assert:
          exit_code: 0
      - assert:
          file: {path: local-summary.md, contains: "| Benchmark | Metric | Base | Head |"}
