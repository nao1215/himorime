# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: himorime

before:
  hooks:
    - go mod tidy
    - go run ./scripts/completions completions

builds:
  - id: himorime
    main: .
    binary: himorime
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    # The supported architectures are stated rather than inherited, so no
    # untested 32-bit artifact appears on a release page.
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/nao1215/himorime/internal/buildinfo.Version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: himorime-comment
    main: ./cmd/himorime-comment
    binary: himorime-comment
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - completions/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# An SPDX SBOM for every archive, generated by Syft.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"

# checksums.txt is signed with cosign keyless signing through the release
# workflow's GitHub OIDC identity. Its digests cover every archive and
# package, so one signature covers them all.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

nfpms:
  - id: packages
    package_name: himorime
    vendor: Naohiro CHIKAMATSU
    homepage: https://nao1215.github.io/himorime/
    maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: Performance budgets and regression checks for command-line programs.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: ./completions/himorime.bash
        dst: /usr/share/bash-completion/completions/himorime
        file_info:
          mode: 0644
      - src: ./completions/himorime.zsh
        dst: /usr/share/zsh/vendor-completions/_himorime
        file_info:
          mode: 0644
      - src: ./completions/himorime.fish
        dst: /usr/share/fish/vendor_completions.d/himorime.fish
        file_info:
          mode: 0644

# A cask for nao1215/homebrew-tap. Writing to the tap needs TAP_GITHUB_TOKEN,
# which only the tag-triggered release job has; snapshots generate the cask
# without publishing it, so release smoke can check its contents. The docs
# mention Homebrew only once a release has actually been published there.
homebrew_casks:
  - name: himorime
    binaries: [himorime, himorime-comment]
    directory: Casks
    homepage: https://nao1215.github.io/himorime/
    description: Performance budgets and regression checks for command-line programs
    license: MIT
    completions:
      bash: completions/himorime.bash
      zsh: completions/himorime.zsh
      fish: completions/himorime.fish
    repository:
      owner: nao1215
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # The binary is not notarized, so remove the quarantine attribute on
    # install; otherwise Gatekeeper refuses to run it.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/himorime"]
          end

release:
  # A tag with a pre-release suffix (-rc1, -beta) is published as a GitHub
  # pre-release and never becomes "Latest".
  prerelease: auto
  header: |
    ## himorime {{ .Tag }}

    Performance budgets and regression checks for command-line programs:
    latency, throughput, CPU time and peak RSS. Every artifact is
    signed and ships with an SBOM and build provenance; see
    [Verify a release](https://nao1215.github.io/himorime/install/#verify-a-release).
  footer: |
    **Full changelog**: https://github.com/nao1215/himorime/compare/{{ .PreviousTag }}...{{ .Tag }}

changelog:
  sort: asc
  use: github
  groups:
    - title: "Breaking changes"
      regexp: '^.*?[a-zA-Z]+(\(.+\))??!:.+$'
      order: 0
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: "Performance"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 3
    - title: "Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^tests?(\\(.+\\))?!?:"
      - "^chore(\\(.+\\))?!?:"
      - "^style(\\(.+\\))?!?:"
      - "^ci(\\(.+\\))?!?:"
      - "Merge pull request"
      - "Merge branch"
