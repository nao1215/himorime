# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/atago/main/schema/atago.schema.json
version: "1"

suite:
  name: himorime compare

# Every scenario builds a throw-away Git repository in its workdir. The
# "program" is a file holding a delay: the build copies it to ${artifact} and
# the benchmark sleeps for that long, so each revision is as fast as its file
# says. Differences are deliberately large (40ms against 250ms) so the
# assertions are about classifications, never about noise.
defaults:
  scenario:
    env:
      GIT_AUTHOR_NAME: himorime-e2e
      GIT_AUTHOR_EMAIL: e2e@example.com
      GIT_COMMITTER_NAME: himorime-e2e
      GIT_COMMITTER_EMAIL: e2e@example.com
      GIT_CONFIG_NOSYSTEM: "1"

scenarios:
  - name: regression selection preserves head-only absolute budgets
    steps:
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: selected comparisons
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: budget
                commands:
                  compared: {command: [e2ehelper, sleep, 1ms]}
                  budgeted:
                    command: [e2ehelper, sleep, 40ms]
                    budget: {latency: {median: "< 1ms"}}
                regression:
                  commands: [compared]
                  latency: {gate: false}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime compare --against main --format json --quiet
          cwd: repo
      - assert:
          exit_code: 1
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands", length: 2}
              - {path: "$.suites[0].benchmarks[0].commands[1].name", equals: budgeted}
              - {path: "$.suites[0].benchmarks[0].commands[1].base", equals: null}
              - {path: "$.suites[0].benchmarks[0].commands[1].comparisons", equals: null}
              - {path: "$.suites[0].benchmarks[0].commands[1].head.count", equals: 10}
              - {path: "$.suites[0].benchmarks[0].commands[1].budgets[0].status", equals: fail}
              - {path: "$.summary.over_budget", equals: 1}
      - run:
          command: himorime compare --against main --format markdown --quiet
          cwd: repo
      - assert:
          exit_code: 1
          stdout: {contains: [budgeted, FAIL, "Budgets (head)"]}

  - name: an unchanged working tree passes
    steps:
      - fixture: {file: repo/delay.txt, content: "40ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: compare
            build:
              command: [e2ehelper, copy, delay.txt, "$${artifact}"]
            defaults: {warmup: 1, runs: 10}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep-from, "$${artifact}"]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - assert: {exit_code: 0}
      - run:
          command: himorime compare --against main
          cwd: repo
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^BENCHMARK +BASE +HEAD +DIFF +CHANGE +CONFIDENCE +TOLERANCE +RESULT$"
      - assert:
          stdout:
            # Identical builds: PASS, or INCONCLUSIVE on a noisy shared
            # runner, but never a regression.
            matches: "(?m)^sleepy +[0-9.]+ms +[0-9.]+ms +[+-]?[0-9.]+(ns|µs|ms) +[+-][0-9.]+% +\\S+ +\\+10% +(PASS|INCONCLUSIVE)$"
      - assert:
          stderr:
            contains: "with the working tree"
            not_contains: "uncommitted"

  - name: a clear regression in uncommitted changes exits 1 and leaves the repository untouched
    steps:
      - fixture: {file: repo/delay.txt, content: "40ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: compare
            build:
              command: [e2ehelper, copy, delay.txt, "$${artifact}"]
            defaults: {warmup: 1, runs: 10}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep-from, "$${artifact}"]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - fixture: {file: repo/delay.txt, content: "250ms\n"}
      - run:
          command: himorime compare --against main --format json
          cwd: repo
      - assert:
          exit_code: 1
          stdout:
            json:
              - {path: "$.mode", equals: "compare"}
              - {path: "$.git.dirty", equals: true}
              - {path: "$.git.base_ref", equals: "main"}
              - {path: "$.git.base_source", equals: "--against"}
              - {path: "$.suites[0].benchmarks[0].commands[0].result", equals: "regression"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.reason", equals: ""}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.verdict", equals: "regression"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.gate", equals: true}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.change_percent", gt: 100}
              - {path: "$.suites[0].benchmarks[0].commands[0].base.metrics.latency.samples", length: 10}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.latency.samples", length: 10}
              - {path: "$.summary.regression", equals: 1}
              - {path: "$.summary.exit_code", equals: 1}
      - assert:
          stderr: {contains: "including uncommitted changes"}
      # The dirty change is still there, no branch appeared, and the
      # temporary worktree is gone.
      - run: {command: git status --porcelain, cwd: repo}
      - assert:
          stdout: {equals: " M delay.txt\n"}
      - run: {command: git worktree list --porcelain, cwd: repo}
      - assert:
          stdout: {count: 1, contains: "worktree "}
      - run: {command: git branch --list, cwd: repo}
      - assert:
          stdout: {equals: "* main\n"}
      - assert:
          file: {path: repo/delay.txt, equals: "250ms\n"}

  - name: a committed speedup is an improvement and exits 0
    steps:
      - fixture: {file: repo/delay.txt, content: "250ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: compare
            build:
              command: [e2ehelper, copy, delay.txt, "$${artifact}"]
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep-from, "$${artifact}"]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run: {command: git switch -q -c faster, cwd: repo}
      - fixture: {file: repo/delay.txt, content: "40ms\n"}
      - run: {command: git -c commit.gpgsign=false commit -q -am faster, cwd: repo}
      - run:
          command: himorime compare --against main
          cwd: repo
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^sleepy .* IMPROVED$"

  - name: noisy measurements are inconclusive and fail only with --fail-on-inconclusive
    steps:
      - fixture: {file: repo/delay.txt, content: "unused\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: noisy
            build:
              command: [e2ehelper, copy, delay.txt, "$${artifact}"]
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: bimodal
                commands:
                  app: {command: [e2ehelper, alternate, "$${workdir}/calls", 10ms, 150ms]}
                regression: {max_cv: 0.3}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime compare --against main
          cwd: repo
      - assert:
          exit_code: 0
          stdout:
            contains: ["INCONCLUSIVE", "bimodal / app: inconclusive: measurements are noisier than max_cv", "1 inconclusive"]
      - run:
          command: himorime compare --against main --fail-on-inconclusive --quiet
          cwd: repo
      - assert:
          exit_code: 1
          stdout: {contains: "INCONCLUSIVE"}
          stderr: {contains: "performance check failed: a comparison was inconclusive"}

  - name: an unknown revision is an execution error that leaves nothing behind
    steps:
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: compare
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep, 1ms]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime compare --against no-such-branch
          cwd: repo
      - assert:
          exit_code: 4
          stderr: {contains: 'revision "no-such-branch" is not a commit'}
      - run: {command: git worktree list --porcelain, cwd: repo}
      - assert:
          stdout: {count: 1, contains: "worktree "}

  - name: a build that fails in the base revision is an execution error and the worktree is removed
    steps:
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: compare
            build:
              command: [e2ehelper, copy, new-delay.txt, "$${artifact}"]
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep-from, "$${artifact}"]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      # Only the working tree has the file the build needs.
      - fixture: {file: repo/new-delay.txt, content: "5ms\n"}
      - run:
          command: himorime compare --against main
          cwd: repo
      - assert:
          exit_code: 4
          stdout: {contains: ["error: build failed: build (base) exited with status 2"]}
      - run: {command: git worktree list --porcelain, cwd: repo}
      - assert:
          stdout: {count: 1, contains: "worktree "}

  - name: an interrupted comparison removes the worktree and runs cleanup
    skip: {os: windows}
    steps:
      - fixture: {file: repo/delay.txt, content: "100ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: interrupt
            build:
              command: [e2ehelper, copy, delay.txt, "$${artifact}"]
            defaults: {warmup: 0, runs: 500}
            benchmarks:
              - name: long
                setup:
                  - command: [e2ehelper, write, "$${root}/interrupt-started"]
                commands:
                  app: {command: [e2ehelper, sleep-from, "$${artifact}"]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: e2ehelper interrupt 60s ${workdir}/repo/interrupt-started -- himorime compare --against main --quiet
          cwd: repo
          timeout: 120s
      - assert:
          exit_code: 0
          stdout: {contains: ["exit=4", "ERROR"]}
      - run: {command: git worktree list --porcelain, cwd: repo}
      - assert:
          stdout: {count: 1, contains: "worktree "}

  - name: regression.commands limits a comparison to the commands built from the tree
    steps:
      - fixture: {file: repo/delay.txt, content: "20ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: partial
            build:
              command: [e2ehelper, copy, delay.txt, "$${artifact}"]
            defaults: {warmup: 0, runs: 10}
            benchmarks:
              - name: mixed
                commands:
                  mine: {command: [e2ehelper, sleep-from, "$${artifact}"]}
                  reference: {command: [e2ehelper, sleep, 1ms]}
                regression:
                  commands: [mine]
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime compare --against HEAD --format json --quiet
          cwd: repo
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands", length: 1}
              - {path: "$.suites[0].benchmarks[0].commands[0].name", equals: "mine"}

  # Without a build, commands run inside ${root} of each revision: a
  # script-style program read from the tree is the base's in the base worktree
  # and the working tree's in the head. delay.txt stands in for the script.
  - name: a command without a build runs the files of each revision
    steps:
      - fixture: {file: repo/bench/delay.txt, content: "40ms\n"}
      - fixture:
          file: repo/bench/himorime.yaml
          content: |
            version: "1"
            name: script
            defaults: {warmup: 1, runs: 10}
            benchmarks:
              - name: script
                commands:
                  own: {command: [e2ehelper, sleep-from, delay.txt]}
              - name: pinned
                commands:
                  shared: {command: [e2ehelper, sleep-from, "$${head_root}/delay.txt"]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - fixture: {file: repo/bench/delay.txt, content: "250ms\n"}
      - run:
          command: himorime compare --against main --quiet --format json bench
          cwd: repo
          timeout: 180s
      - assert:
          exit_code: 1
          stdout:
            json:
              # The base ran its own 40ms delay, the head the working tree's
              # 250ms: a regression.
              - {path: "$.suites[0].benchmarks[0].commands[0].result", equals: "regression"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.reason", equals: ""}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.verdict", equals: "regression"}
              - {path: "$.suites[0].benchmarks[0].commands[0].base.metrics.latency.stats.median", lt: 150000000}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.latency.stats.median", gte: 250000000}
              # ${head_root} gives both revisions the working tree's file.
              - {path: "$.suites[0].benchmarks[1].commands[0].base.metrics.latency.stats.median", gte: 250000000}
              - {path: "$.suites[0].benchmarks[1].commands[0].head.metrics.latency.stats.median", gte: 250000000}
              - {path: "$.summary.regression", equals: 1}
      - run: {command: git status --porcelain, cwd: repo}
      - assert:
          stdout: {equals: " M bench/delay.txt\n"}

  - name: a fixture that only the working tree has fails the base with a hint
    steps:
      - fixture: {file: repo/himorime.yaml, content: "version: \"1\"\nname: fixture\ndefaults: {warmup: 0, runs: 2, regression: {min_samples: 2}}\nbenchmarks:\n  - name: new input\n    stdin: input.txt\n    commands:\n      app: {command: [e2ehelper, sleep, 1ms]}\n"}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - fixture: {file: repo/input.txt, content: "added in the working tree\n"}
      - run:
          command: himorime compare --against main --quiet
          cwd: repo
          timeout: 120s
      - assert:
          exit_code: 4
          stdout:
            contains: ["input.txt does not exist in the base revision", "start the path with ${head_root}"]
      - run: {command: git worktree list --porcelain, cwd: repo}
      - assert:
          stdout: {count: 1, contains: "worktree "}

  - name: adaptive runs of a comparison continue until min_samples
    steps:
      - fixture: {file: repo/delay.txt, content: "20ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: adaptive
            defaults: {warmup: 0, min_runs: 2, max_runs: 10, min_time: 1ms}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep-from, delay.txt]}
                regression: {min_samples: 5}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime compare --against main --quiet --format json
          cwd: repo
          timeout: 120s
      - assert:
          exit_code: 0
          stdout:
            json:
              # min_runs 2 and min_time 1ms hold after two rounds, but a verdict
              # needs five samples per side.
              - {path: "$.suites[0].benchmarks[0].rounds", equals: 5}
              - {path: "$.suites[0].benchmarks[0].commands[0].base.metrics.latency.samples", length: 5}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.latency.samples", length: 5}
      # A plain run judges no comparison and stops at min_runs.
      - run:
          command: himorime run --quiet --format json
          cwd: repo
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].rounds", equals: 2}
      # max_runs below min_samples is refused before anything runs.
      - fixture: {file: repo/himorime.yaml, content: "version: \"1\"\nname: adaptive\ndefaults: {warmup: 0, min_runs: 2, max_runs: 4}\nbenchmarks:\n  - name: sleepy\n    commands:\n      app: {command: [e2ehelper, sleep-from, delay.txt]}\n    regression: {min_samples: 5}\n"}
      - run:
          command: himorime compare --against main --quiet
          cwd: repo
      - assert:
          exit_code: 2
          stderr: {contains: "max_runs (4) is lower than regression.min_samples (5)"}
      - run:
          command: himorime compare --against main --quiet --runs 3
          cwd: repo
      - assert:
          exit_code: 3
          stderr: {contains: "--runs 3 is lower than regression.min_samples (5)"}

  - name: a regression of a metric that is not gated is reported without failing
    steps:
      - fixture: {file: repo/delay.txt, content: "20ms\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: gate
            defaults: {warmup: 1, runs: 10}
            benchmarks:
              - name: sleepy
                commands:
                  app: {command: [e2ehelper, sleep-from, delay.txt]}
                regression:
                  latency: {gate: false}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - fixture: {file: repo/delay.txt, content: "250ms\n"}
      - run:
          command: himorime compare --against main --quiet --fail-on-inconclusive --format json
          cwd: repo
          timeout: 120s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].result", equals: "pass"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.reason", equals: ""}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.verdict", equals: "regression"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.gate", equals: false}
              - {path: "$.summary.regression", equals: 0}
              - {path: "$.summary.not_gated.regression", equals: 1}
              - {path: "$.summary.exit_code", equals: 0}
      - run:
          command: himorime compare --against main --quiet
          cwd: repo
          timeout: 120s
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^sleepy +.* REGRESSION \\(NOT GATED\\)$"
      - assert:
          stdout:
            contains: ["(NOT GATED) marks a metric with gate: false", "not gated: 1 regressed"]

  - name: a fixture of a different size skips the derived throughput comparison
    steps:
      - fixture: {file: repo/input.txt, content: "0123456789012345678901234567890123456789\n"}
      - fixture:
          file: repo/himorime.yaml
          content: |
            version: "1"
            name: work
            defaults: {warmup: 0, runs: 10, regression: {min_samples: 5}}
            benchmarks:
              - name: sleepy
                metrics:
                  throughput:
                    work: {file_size: input.txt}
                commands:
                  app: {command: [e2ehelper, sleep, 20ms]}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      # The command ignores the file and sleeps for the same time in both
      # revisions. Only the declared work shrinks, from 41 bytes to 11.
      - fixture: {file: repo/input.txt, content: "0123456789\n"}
      - run:
          command: himorime compare --against main --quiet --format json
          cwd: repo
          timeout: 120s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.throughput.verdict", equals: "skipped"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.throughput.reason", matches: "^throughput needs constant, equal work"}
              - {path: "$.suites[0].benchmarks[0].commands[0].base.metrics.throughput.work.measured_min", equals: 41}
              - {path: "$.suites[0].benchmarks[0].commands[0].base.metrics.throughput.work.measured_max", equals: 41}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.throughput.work.measured_min", equals: 11}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.throughput.work.measured_max", equals: 11}
      - run:
          command: himorime compare --against main --quiet
          cwd: repo
          timeout: 120s
      - assert:
          exit_code: 0
          stdout:
            contains: "throughput needs constant, equal work: 41 bytes in the base, 11 bytes in the head"
