# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/atago/main/schema/atago.schema.json
version: "1"

suite:
  name: himorime command line

# The command-line contract: help, version, usage errors and their exit codes,
# init, validate, list and shell completion. Nothing here measures anything.
scenarios:
  - name: help and version exit 0 and print to stdout
    steps:
      - run:
          command: himorime --help
      - assert:
          exit_code: 0
          stdout:
            contains: [init, validate, list, run, compare, ci, report, version, completion, "Documentation: https://nao1215.github.io/himorime/", "GitHub Sponsors: https://github.com/sponsors/nao1215"]
      - run:
          command: himorime version
      - assert:
          exit_code: 0
          stdout:
            matches: "^himorime \\S+ \\(go"
      - run:
          command: himorime run --help
      - assert:
          exit_code: 0
          stdout:
            contains: ["--filter", "--tag", "--skip-tag", "--format", "--seed"]

  - name: usage errors exit 3 on stderr with nothing on stdout
    steps:
      - run:
          command: himorime
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: ["HMR3001", "no command given"]}
      - run:
          command: himorime frobnicate
      - assert:
          exit_code: 3
          stderr: {contains: ["HMR3001", 'unknown command "frobnicate"']}
      - run:
          command: himorime run --no-such-flag
      - assert:
          exit_code: 3
          stderr: {contains: ["HMR3001", "flag provided but not defined"]}
      - run:
          command: himorime compare
      - assert:
          exit_code: 3
          stderr: {contains: "--against is required"}
      - run:
          command: himorime completion tcsh
      - assert:
          exit_code: 3
          stderr: {contains: "unsupported shell"}
      - run:
          command: himorime run --filter '('
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: ["HMR3001", "invalid --filter"]}
      - run:
          command: himorime comment
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: ["HMR3001", "unknown command"]}

  - name: saved reports render without rerunning and preserve stored failure status
    steps:
      - fixture:
          file: passing.yaml
          content: |
            version: "1"
            suite: {name: saved report}
            defaults: {warmup: 0, runs: 2}
            benchmarks:
              - name: pass
                commands:
                  tool: {command: [e2ehelper, counter, calls.txt]}
      - run:
          command: himorime run --quiet --format json --output pass.json passing.yaml
      - assert:
          exit_code: 0
          file:
            path: pass.json
            contains: ['"schema_version": "1"', '"status": "measured"']
      - assert:
          file:
            path: calls.txt
            equals: "2"
      - run:
          command: e2ehelper remove passing.yaml
      - assert:
          file:
            path: passing.yaml
            exists: false
      - run:
          command: himorime report pass.json
      - assert:
          exit_code: 0
          stdout: {contains: ["saved report", "PASS", "exit 0"]}
      - assert:
          file:
            path: calls.txt
            equals: "2"
      - run:
          command: himorime report pass.json --format markdown --output pass.md
      - assert:
          exit_code: 0
          file:
            path: pass.md
            contains: ["## saved report", "| pass | tool |", "PASS"]
      - fixture:
          file: failing.yaml
          content: |
            version: "1"
            suite: {name: saved failure}
            defaults: {warmup: 0, runs: 1}
            benchmarks:
              - name: fail
                commands:
                  tool: {command: [e2ehelper, exit, "7"]}
      - run:
          command: himorime run --quiet --format json --output failure.json failing.yaml
      - assert:
          exit_code: 4
          file:
            path: failure.json
            contains: ['"schema_version": "1"', '"exit_code": 7']
      - run:
          command: himorime report failure.json
      - assert:
          exit_code: 0
          stdout: {contains: ["saved failure", "ERROR", "exit 4"]}
      - fixture: {file: malformed.json, content: "{\n"}
      - run:
          command: himorime report malformed.json
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr: {contains: ["HMR2001", "invalid JSON"]}
      - fixture: {file: unknown.json, content: '{"schema_version":"9"}'}
      - run:
          command: himorime report unknown.json
      - assert:
          exit_code: 2
          stderr: {contains: ["unsupported report schema version"]}
      - run:
          command: himorime report pass.json --format csv
      - assert:
          exit_code: 3
          stderr: {contains: ["HMR3001", "unknown --format"]}
      - run:
          command: himorime report pass.json --output pass.json/child
      - assert:
          exit_code: 4
          stderr: {contains: ["HMR4003", "check output path"]}
      - assert:
          file:
            path: pass.json
            contains: ['"schema_version": "1"', '"status": "measured"']

  - name: init writes a runnable suite and never overwrites silently
    steps:
      - run:
          command: himorime init
      - assert:
          exit_code: 0
          stdout: {contains: "wrote himorime.yaml"}
      - assert:
          file:
            path: himorime.yaml
            contains: ["# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json", 'version: "1"']
      - run:
          command: himorime init
      - assert:
          exit_code: 3
          stderr: {contains: "already exists"}
      - run:
          command: himorime init --force
      - assert:
          exit_code: 0
      - run:
          command: himorime validate
      - assert:
          exit_code: 0
          stdout: {equals: "himorime.yaml: ok (1 benchmark, 1 command)\n"}
      - run:
          command: himorime run --quiet
      - assert:
          exit_code: 0
          stdout: {contains: ["git startup", "PASS"]}

  - name: validate names the file, line, field, cause and fix, and exits 2
    steps:
      - fixture:
          file: broken.yaml
          content: |
            version: "1"
            name: broken
            benchmarks:
              - name: parse
                runs: "20"
                baseline: missing
                commands:
                  tool:
                    command: "tool --flag"
                    timout: 5s
      - run:
          command: himorime validate broken.yaml
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains:
              - "HMR2001"
              - "broken.yaml:5:11: benchmarks[0].runs: expected an integer, got a string"
              - "benchmarks[0].commands.tool: a string command requires shell: true"
              - 'benchmarks[0].commands.tool.timout: unknown key "timout"'
              - "hint:"
              - "nothing was run"

  - name: semantic errors are reported after the schema passes
    steps:
      - fixture:
          file: semantic.yaml
          content: |
            version: "1"
            name: semantic
            benchmarks:
              - name: parse
                baseline: missing
                commands:
                  tool:
                    command: ["$${artifact}"]
      - run:
          command: himorime validate semantic.yaml
      - assert:
          exit_code: 2
          stderr:
            contains:
              - "HMR2001"
              - 'semantic.yaml:5:15: benchmarks[0].baseline: baseline "missing" is not a command of this benchmark'
              - "${artifact} is used but the suite has no build section"

  - name: a relative path that leaves the project is rejected before anything runs
    steps:
      - fixture:
          file: escape.yaml
          content: |
            version: "1"
            name: escape
            benchmarks:
              - name: parse
                commands:
                  tool:
                    command: [e2ehelper, sleep, 1ms]
                    cwd: ../..
      - run:
          command: himorime validate escape.yaml
      - assert:
          exit_code: 2
          stderr:
            contains:
              - 'escape.yaml:8:14: benchmarks[0].commands.tool.cwd: path "../.." leaves the project'
              - "paths must stay inside the repository holding the suite"
      # run refuses the same suite for the same reason, without building or
      # measuring anything.
      - run:
          command: himorime run escape.yaml
      - assert:
          exit_code: 2
          stderr:
            contains: 'path "../.." leaves the project'
            not_contains: "resolves outside the project"

  - name: a missing suite file is a configuration error
    steps:
      - run:
          command: himorime run
      - assert:
          exit_code: 2
          stderr: {contains: ["HMR2001", "himorime.yaml: suite file does not exist"]}

  - name: double dash preserves every following path
    steps:
      - fixture:
          file: --first.yaml
          content: |
            version: "1"
            name: first
            benchmarks:
              - name: check
                commands:
                  tool: {command: [e2ehelper, exit, "0"]}
      - fixture:
          file: --second.yaml
          content: |
            version: "1"
            name: second
            benchmarks:
              - name: check
                commands:
                  tool: {command: [e2ehelper, exit, "0"]}
      - run:
          command: himorime validate -- --first.yaml --second.yaml
      - assert:
          exit_code: 0
          stdout:
            contains: ["--first.yaml: ok", "--second.yaml: ok"]

  - name: a measured command failure is an execution error
    steps:
      - fixture:
          file: execution.yaml
          content: |
            version: "1"
            name: execution
            defaults: {warmup: 0, runs: 1}
            benchmarks:
              - name: failing command
                commands:
                  app: {command: [e2ehelper, exit, "9"]}
      - run:
          command: himorime run --quiet execution.yaml
      - assert:
          exit_code: 4
          stderr: {contains: ["HMR4001", "measurement did not complete"]}

  - name: list prints a stable table and JSON without running anything
    steps:
      - fixture:
          file: himorime.yaml
          content: |
            version: "1"
            name: listing
            benchmarks:
              - name: parse small
                tags: [parser, smoke]
                stdin: fixtures/small.txt
                baseline: fast
                commands:
                  fast: {command: [e2ehelper, exit, "9"]}
                  slow: {command: "e2ehelper exit 9", shell: true}
              - name: parse large
                tags: [parser, slow]
                commands:
                  fast: {command: [e2ehelper, exit, "9"]}
      - run:
          command: himorime list
      - assert:
          exit_code: 0
          stdout:
            equals: |
              SUITE          BENCHMARK    TAGS          STDIN               COMMAND  RUN
              himorime.yaml  parse small  parser,smoke  fixtures/small.txt  fast*    e2ehelper exit 9
              himorime.yaml  parse small  parser,smoke  fixtures/small.txt  slow     shell: e2ehelper exit 9
              himorime.yaml  parse large  parser,slow   -                   fast     e2ehelper exit 9
      - run:
          command: himorime list --format json --tag slow
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$", length: 1}
              - {path: "$[0].benchmark", equals: "parse large"}
              - {path: "$[0].tags[1]", equals: "slow"}
      - run:
          command: himorime list --skip-tag slow --filter small --format json
      - assert:
          stdout:
            json:
              - {path: "$", length: 2}
              - {path: "$[1].shell", equals: true}
      - run:
          command: himorime list --tag nonexistent
      - assert:
          exit_code: 0
          stderr:
            contains: "no benchmark matches"
            not_contains: "HMR"

  - name: completion scripts name every command
    steps:
      - run:
          command: himorime completion bash
      - assert:
          exit_code: 0
          stdout: {contains: ["complete -o default -F _himorime himorime", "fail-on-inconclusive"]}
      - run:
          command: himorime completion zsh
      - assert:
          stdout: {contains: "#compdef himorime"}
      - run:
          command: himorime completion fish
      - assert:
          stdout: {contains: "complete -c himorime"}
      - run:
          command: himorime completion powershell
      - assert:
          stdout: {contains: "Register-ArgumentCompleter -Native -CommandName himorime"}
