name: Comment benchmark result

on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin the problem-only notification renderer; never use the triggering PR's ref.
      # Keep the dispatcher and optional helper at the same revision.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install himorime and its comment helper
        run: go install github.com/nao1215/himorime@da696087020498e386877a358ecc0ed7413327bc github.com/nao1215/himorime/cmd/himorime-comment@da696087020498e386877a358ecc0ed7413327bc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: himorime-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - run: himorime comment "$RUNNER_TEMP/himorime.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
