name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A standard-library advisory is fixed in a specific patch, so the go.mod
  # minimum and the newest Go can differ. Keep the first entry equal to the go
  # directive in go.mod.
  govulncheck:
    name: govulncheck (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.6", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      # Pinned so a scanner release cannot change the verdict on its own. The
      # advisory database is intentionally not pinned.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # ACCEPTED lists advisories himorime is known to reach and defends
      # against on its own side, one ID each, with why, which test holds the
      # defense, and when to remove it. Empty today. JSON mode exits 0 even
      # with findings, so the verdict is made here: any other reachable
      # advisory fails the job and prints the text report.
      # pipefail and the record-count check keep a failed or empty scan from
      # reading as "nothing found": the default run shell does not set pipefail,
      # so a jq error would otherwise be hidden behind sort.
      - name: govulncheck
        env:
          ACCEPTED: ""
        run: |
          set -o pipefail
          govulncheck -format json ./... > "$RUNNER_TEMP/govulncheck.json"
          jq -e -s 'length > 0' "$RUNNER_TEMP/govulncheck.json" > /dev/null
          jq -r 'select(.finding != null and (.finding.trace[0].function // "") != "") | .finding.osv' \
            "$RUNNER_TEMP/govulncheck.json" | sort -u > "$RUNNER_TEMP/called.txt"
          tr ' ' '\n' <<< "$ACCEPTED" | sed '/^$/d' > "$RUNNER_TEMP/accepted.txt"
          if grep -vxF -f "$RUNNER_TEMP/accepted.txt" "$RUNNER_TEMP/called.txt"; then
            echo "::error::govulncheck found an advisory that is not in ACCEPTED"
            govulncheck ./...
            exit 1
          fi

  # The gitleaks CLI rather than the action: the action needs a token and, for
  # organizations, a license key, and this job must work on fork pull
  # requests with a read-only token.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --no-banner .
