name: Build

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - SECURITY.md
      - 'website/**'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'
      - .github/pull_request_template.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cross-compile every OS and architecture himorime supports or at least keeps
  # compiling for. Release builds cover the six published targets; the BSDs
  # are here so that a Unix-only assumption cannot slip in unnoticed.
  # One job per architecture builds all six systems in turn: a single build
  # takes about ten seconds after setup, so twelve jobs mostly waited for a
  # runner and spent their time checking out and installing Go.
  cross:
    name: build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          failed=""
          for goos in linux darwin windows freebsd openbsd netbsd; do
            echo "::group::${goos}/${GOARCH}"
            if ! GOOS="$goos" go build -trimpath -o /dev/null .; then
              failed="$failed $goos/$GOARCH"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::build failed for:$failed"
            exit 1
          fi

  # go.mod and go.sum must already be tidy, and generated documentation must
  # match the code, so neither changes silently at release time.
  drift:
    name: go mod tidy and generated docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: generated documentation is up to date
        run: |
          make docs
          git diff --exit-code
