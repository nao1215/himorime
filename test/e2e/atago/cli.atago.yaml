# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/atago/main/schema/atago.schema.json
version: "1"

suite:
  name: yahiko command line

# The command-line contract: help, version, usage errors and their exit codes,
# init, validate, list and shell completion. Nothing here measures anything.
scenarios:
  - name: help and version exit 0 and print to stdout
    steps:
      - run:
          command: yahiko --help
      - assert:
          exit_code: 0
          stdout:
            contains: [init, validate, list, run, compare, ci, version, completion]
      - run:
          command: yahiko version
      - assert:
          exit_code: 0
          stdout:
            matches: "^yahiko \\S+ \\(go"
      - run:
          command: yahiko run --help
      - assert:
          exit_code: 0
          stdout:
            contains: ["--filter", "--tag", "--skip-tag", "--format", "--seed"]

  - name: usage errors exit 3 on stderr with nothing on stdout
    steps:
      - run:
          command: yahiko
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: "no command given"}
      - run:
          command: yahiko frobnicate
      - assert:
          exit_code: 3
          stderr: {contains: 'unknown command "frobnicate"'}
      - run:
          command: yahiko run --no-such-flag
      - assert:
          exit_code: 3
          stderr: {contains: "flag provided but not defined"}
      - run:
          command: yahiko compare
      - assert:
          exit_code: 3
          stderr: {contains: "--against is required"}
      - run:
          command: yahiko completion tcsh
      - assert:
          exit_code: 3
          stderr: {contains: "unsupported shell"}

  - name: init writes a runnable suite and never overwrites silently
    steps:
      - run:
          command: yahiko init
      - assert:
          exit_code: 0
          stdout: {contains: "wrote yahiko.yaml"}
      - assert:
          file:
            path: yahiko.yaml
            contains: ["# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/yahiko/main/schema/yahiko.schema.json", 'version: "1"']
      - run:
          command: yahiko init
      - assert:
          exit_code: 3
          stderr: {contains: "already exists"}
      - run:
          command: yahiko init --force
      - assert:
          exit_code: 0
      - run:
          command: yahiko validate
      - assert:
          exit_code: 0
          stdout: {equals: "yahiko.yaml: ok (1 benchmark, 1 command)\n"}
      - run:
          command: yahiko run --quiet
      - assert:
          exit_code: 0
          stdout: {contains: ["git startup", "PASS"]}

  - name: validate names the file, line, field, cause and fix, and exits 2
    steps:
      - fixture:
          file: broken.yaml
          content: |
            version: "1"
            suite: {name: broken}
            benchmarks:
              - name: parse
                runs: "20"
                baseline: missing
                commands:
                  tool:
                    command: "tool --flag"
                    timout: 5s
      - run:
          command: yahiko validate broken.yaml
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains:
              - "broken.yaml:5:11: benchmarks[0].runs: expected an integer, got a string"
              - "benchmarks[0].commands.tool: a string command requires shell: true"
              - 'benchmarks[0].commands.tool.timout: unknown key "timout"'
              - "hint:"
              - "nothing was run"

  - name: semantic errors are reported after the schema passes
    steps:
      - fixture:
          file: semantic.yaml
          content: |
            version: "1"
            suite: {name: semantic}
            benchmarks:
              - name: parse
                baseline: missing
                commands:
                  tool:
                    command: ["$${artifact}"]
      - run:
          command: yahiko validate semantic.yaml
      - assert:
          exit_code: 2
          stderr:
            contains:
              - 'semantic.yaml:5:15: benchmarks[0].baseline: baseline "missing" is not a command of this benchmark'
              - "${artifact} is used but the suite has no build section"

  - name: a missing suite file is a configuration error
    steps:
      - run:
          command: yahiko run
      - assert:
          exit_code: 2
          stderr: {contains: "yahiko.yaml: suite file does not exist"}

  - name: list prints a stable table and JSON without running anything
    steps:
      - fixture:
          file: yahiko.yaml
          content: |
            version: "1"
            suite: {name: listing}
            benchmarks:
              - name: parse small
                tags: [parser, smoke]
                stdin: fixtures/small.txt
                baseline: fast
                commands:
                  fast: {command: [e2ehelper, exit, "9"]}
                  slow: {command: "e2ehelper exit 9", shell: true}
              - name: parse large
                tags: [parser, slow]
                commands:
                  fast: {command: [e2ehelper, exit, "9"]}
      - run:
          command: yahiko list
      - assert:
          exit_code: 0
          stdout:
            equals: |
              SUITE        BENCHMARK    TAGS          STDIN               COMMAND  RUN
              yahiko.yaml  parse small  parser,smoke  fixtures/small.txt  fast*    e2ehelper exit 9
              yahiko.yaml  parse small  parser,smoke  fixtures/small.txt  slow     shell: e2ehelper exit 9
              yahiko.yaml  parse large  parser,slow   -                   fast     e2ehelper exit 9
      - run:
          command: yahiko list --format json --tag slow
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$", length: 1}
              - {path: "$[0].benchmark", equals: "parse large"}
              - {path: "$[0].tags[1]", equals: "slow"}
      - run:
          command: yahiko list --skip-tag slow --filter small --format json
      - assert:
          stdout:
            json:
              - {path: "$", length: 2}
              - {path: "$[1].shell", equals: true}

  - name: completion scripts name every command
    steps:
      - run:
          command: yahiko completion bash
      - assert:
          exit_code: 0
          stdout: {contains: ["complete -o default -F _yahiko yahiko", "fail-on-inconclusive"]}
      - run:
          command: yahiko completion zsh
      - assert:
          stdout: {contains: "#compdef yahiko"}
      - run:
          command: yahiko completion fish
      - assert:
          stdout: {contains: "complete -c yahiko"}
      - run:
          command: yahiko completion powershell
      - assert:
          stdout: {contains: "Register-ArgumentCompleter -Native -CommandName yahiko"}
