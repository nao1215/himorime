# yaml-language-server: $schema=../schema/yahiko.schema.json
#
# yahiko measuring itself. Informational: .github/workflows/benchmark.yml runs
# `yahiko ci bench` on pull requests without blocking merges, and `make bench`
# runs it locally.
version: "1"

suite:
  name: yahiko dogfood
  description: Start-up, validation and a small measured run of yahiko itself.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..

defaults:
  warmup: 2
  runs: 15
  regression:
    confidence: 0.95
    latency:
      max_percent: 15

benchmarks:
  - name: version
    tags: [smoke]
    commands:
      yahiko:
        command: ["${artifact}", version]

  - name: validate every example
    commands:
      yahiko:
        command:
          - "${artifact}"
          - validate
          - "${root}/../examples/cache"
          - "${root}/../examples/compare-clis"
          - "${root}/../examples/input-sizes"
          - "${root}/../examples/reports"
          - "${root}/../examples/stdin-fixture"

  - name: list with a filter
    commands:
      yahiko:
        command: ["${artifact}", list, --format, json, --filter, "^(small|large)$", "${root}/../examples/input-sizes"]

  - name: run a tiny suite
    setup:
      - command: ["${artifact}", init, "${workdir}/tiny.yaml"]
    commands:
      yahiko:
        command: ["${artifact}", run, --quiet, --runs, "3", --warmup, "0", --format, json, "${workdir}/tiny.yaml"]

  - name: collector overhead
    description: >-
      The same suite measured with latency only and with every metric. The
      difference is what reading CPU time and peak RSS after each run costs
      yahiko; it is never part of a measured run.
    commands:
      latency-only:
        command: ["${artifact}", run, --quiet, --runs, "20", --warmup, "0", --format, json, "${root}/testdata/latency-only.yaml"]
      all-metrics:
        command: ["${artifact}", run, --quiet, --runs, "20", --warmup, "0", --format, json, "${root}/testdata/all-metrics.yaml"]
