version: "1"
suite:
  name: full
  description: every key the format has
defaults:
  warmup: 2
  runs: 15
  min_runs: 5
  max_runs: 50
  min_time: 500ms
  timeout: 30s
  cwd: fixtures
  env:
    LANG: C
  stdout: discard
  stderr: logs/err.txt
  exit_codes: [0]
  metrics:
    latency: true
    cpu: {scope: process_tree}
    memory: false
    unsupported: skip
  regression:
    latency: {metric: mean, max_percent: "7.5%", min_difference: 1ms, gate: true}
    confidence: 0.99
    min_samples: 10
    max_cv: 0.25
    throughput: {metric: median, max_percent: 8}
    cpu: {metric: mean, max_percent: "12%", min_difference: 2ms}
    memory: {metric: median, max_percent: 5, min_difference: 1MiB}
build:
  command: [go, build, -o, "${artifact}", ./cmd/tool]
  shell: false
  cwd: "${root}"
  env:
    CGO_ENABLED: "0"
  timeout: 5m
benchmarks:
  - name: parse
    description: parse a fixture
    tags: [parser, smoke]
    warmup: 1
    runs: 20
    min_runs: 10
    max_runs: 30
    min_time: 1s
    timeout: 10s
    cwd: "${workdir}"
    env:
      TOKEN: "${env:TOKEN}"
    stdout: out/last.txt
    stderr: discard
    exit_codes: [0, 1]
    stdin: testdata/input.txt
    setup:
      - command: [gen, "${workdir}/big.txt"]
        timeout: 1m
    prepare_each:
      - command: "rm -rf ${workdir}/cache"
        shell: true
    cleanup:
      - command: [cleanup]
        cwd: "${workdir}"
        env:
          X: "1"
    baseline: tool
    commands:
      tool:
        command: ["${artifact}${exe}", --parse]
        timeout: 5s
        cwd: sub
        env:
          MODE: fast
        stdout: discard
        stderr: discard
        exit_codes: [0]
      other:
        command: "other --parse < ${workdir}/big.txt"
        shell: true
    metrics:
      latency: true
      throughput:
        work: {value: 1000, unit: records}
      cpu: true
      memory: {scope: process_tree}
      unsupported: fail
    budget:
      tool:
        mean: "< 30ms"
        median: "<= 20ms"
        min: "< 1s"
        max: "< 2s"
        latency: {p90: "<= 25ms", p99.9: "< 1s"}
        throughput: {median: ">= 1000 records/s", min: "> 10 records/s"}
        cpu:
          user: {median: "<= 20ms"}
          system: {p95: "<= 5ms"}
          total: {mean: "< 30ms"}
          utilization: {median: "<= 110%", min: ">= 50%"}
        memory:
          peak_rss: {max: "<= 64MiB", median: "< 60000KB"}
    regression:
      latency: {metric: median, max_percent: 10, min_difference: 500us, gate: false}
      throughput: {max_percent: 10, min_difference: "10 records/s", gate: true}
      cpu: {max_percent: 15}
      memory: {min_difference: 256KiB}
      confidence: 0.95
      min_samples: 12
      max_cv: 0
      commands: [tool]
  - name: inline stdin
    stdin:
      content: "hello\n"
    commands:
      cat:
        command: [cat]
  - name: file stdin
    stdin:
      file: "${root}/testdata/x.txt"
    metrics:
      throughput:
        work: {file_size: "${root}/testdata/x.txt", unit: bytes}
    commands:
      cat:
        command: [cat]
    budget:
      cat:
        throughput: {p95: ">= 1.5GiB/s"}
report:
  outputs:
    - format: json
      path: results/bench.json
    - format: markdown
      path: results/bench.md
    - format: csv
      path: results/bench.csv
    - format: github
      path: results/summary.md
    - format: samples-csv
      path: results/samples.csv
