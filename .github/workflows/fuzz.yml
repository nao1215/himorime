name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - SECURITY.md
      - 'website/**'
      - 'doc/**'
      - '.github/ISSUE_TEMPLATE/**'
      - .github/pull_request_template.md
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every event runs each target briefly; the nightly schedule runs each for
  # five minutes. internal/docgen fails when a fuzz target in the tree is
  # missing from this matrix.
  fuzz:
    name: fuzz (${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/config, name: FuzzLoad }
          - { pkg: ./internal/config, name: FuzzParseDuration }
          - { pkg: ./internal/metric, name: FuzzParseThreshold }
          - { pkg: ./internal/config, name: FuzzExpand }
          - { pkg: ./internal/stats, name: FuzzCompare }
          - { pkg: ./internal/report, name: FuzzReportFormats }
          - { pkg: ./internal/report, name: FuzzEscapeMarkdown }
          - { pkg: ./internal/ghactions, name: FuzzResolveBase }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: fuzz
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '5m' || '20s' }}
          TARGET: ${{ matrix.target.name }}
          PKG: ${{ matrix.target.pkg }}
        run: go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime "${FUZZTIME}" "${PKG}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers-${{ matrix.target.name }}
          path: "**/testdata/fuzz/**"

  # The rapid properties run with 100 cases in every unit test run; the
  # nightly schedule searches much longer. A failure prints the seed and
  # saves the case under testdata/rapid.
  properties:
    name: properties (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: properties
        run: go test -run '^Test(Compare(IsInvariant|Mirrors|Never|IsMonotone)|SummaryProperties)' -count=1 ./internal/stats -rapid.checks=50000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapid-failures
          path: "**/testdata/rapid/**"
