name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same Go entry point on every OS: it builds himorime and the portable
  # helper, runs every atago spec under test/e2e/atago, and fails if the run
  # modified the repository. Scenarios that need POSIX signals say so with
  # skip: {os: windows}.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ATAGO_VERSION: v0.23.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # The prebuilt atago release, verified and put on PATH by its action.
      - uses: nao1215/setup-atago@7cae89595fcbba334db0fe16fc9a24ed5b0a3fea # v0.1.2
        with:
          version: ${{ env.ATAGO_VERSION }}
      - name: run the E2E suite
        env:
          HIMORIME_E2E_REPORT_DIR: ${{ runner.temp }}/himorime-e2e-reports
        run: go run ./test/e2e/run
      - name: retain comparison reasons and samples
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/himorime-e2e-reports
          if-no-files-found: warn
          retention-days: 14
