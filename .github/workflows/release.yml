name: Release

on:
  push:
    tags: ["v*"]

# The only workflow with write permissions, granted per job:
#   contents: write      create the GitHub Release and upload its files,
#                        including the SLSA provenance
#   id-token: write      keyless cosign signing and provenance through OIDC
#   attestations: write  publish the build provenance
#   pages: write         deploy the documentation site
permissions:
  contents: read

jobs:
  # The archives of the tag are built, checked and run on every OS before
  # anything is published: a release cannot be taken back.
  smoke:
    uses: ./.github/workflows/release-smoke.yml

  goreleaser:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # base64 of checksums.txt: the subjects the SLSA provenance job attests.
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # No module or build cache in the job that holds the OIDC token: a
          # cache written by a less privileged run could change what is built.
          cache: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
      - name: Generate subject
        id: hash
        env:
          ARTIFACTS: "${{ steps.run-goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail

          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(base64 -w0 < "$checksum_file")" >> "$GITHUB_OUTPUT"

  # SLSA build provenance as a release asset (multiple.intoto.jsonl). The GitHub
  # attestation above is kept, but it is not a release asset, so it is invisible
  # to anyone who only has the downloaded files and to OpenSSF Scorecard's
  # Signed-Releases check. The generator must be referenced by tag, not by
  # commit SHA: slsa-verifier checks the reusable workflow's ref.
  provenance:
    name: SLSA provenance
    needs: [goreleaser]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true # upload to the release goreleaser just created

  # Verify the published archives against the published provenance, the way a
  # user would, so a provenance that does not verify fails the release run.
  verification:
    name: Verify SLSA provenance
    needs: [goreleaser, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install the verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "*.tar.gz" -p "*.zip"
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "$PROVENANCE"

      # checksums.txt also lists the .deb/.rpm/.apk packages and the SBOMs; only
      # the archives are downloaded above, so only they are verified here.
      - name: Verify assets
        env:
          CHECKSUMS: ${{ needs.goreleaser.outputs.hashes }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          checksums=$(echo "$CHECKSUMS" | base64 -d)
          while read -r _ fn; do
            case "$fn" in
              *.tar.gz|*.zip) ;;
              *) continue ;;
            esac
            echo "Verifying $fn"
            slsa-verifier verify-artifact --provenance-path "$PROVENANCE" \
                                          --source-uri "github.com/$GITHUB_REPOSITORY" \
                                          --source-tag "$GITHUB_REF_NAME" \
                                          "$fn"
          done <<<"$checksums"

  website:
    needs: goreleaser
    uses: ./.github/workflows/website.yml

  deploy-pages:
    needs: website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
