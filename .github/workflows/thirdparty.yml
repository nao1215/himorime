name: ThirdParty

# Runs the suites in bench/thirdparty, which measure programs nobody here
# maintains. They exist as worked examples of a himorime.yaml for a real
# program, so this job keeps them correct as those tools and himorime change.
# It publishes nothing: the numbers of a run are in its job summary and in its
# artifact, because a number measured on a shared runner says less than the
# suite a reader can run today.
#
# The job fails only when a measurement fails - a tool that cannot be
# installed, a command that exits non-zero, or himorime reporting an error.
# The speed of a program this repository does not maintain is never a reason
# to fail a change here, and no suite carries a budget.
#
# The runner is pinned rather than ubuntu-latest: when a suite starts failing,
# it has to be possible to tell a change of tool from a change of image.

on:
  workflow_dispatch:
  schedule:
    # 05:40 UTC on Mondays.
    - cron: "40 5 * * 1"
  pull_request:
    paths:
      - "bench/thirdparty/**"
      - ".github/workflows/thirdparty.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build himorime
        run: go build -trimpath -o "$RUNNER_TEMP/himorime" .

      # The JSON tools are pinned: a go install leg pins a module version,
      # whose integrity comes from the Go checksum database, and downloaded
      # binaries pin a version and a SHA256 checked before installation. The
      # compression utilities come from the explicitly pinned Ubuntu image and
      # their versions are recorded in the report.
      - name: Install the JSON processors
        env:
          JQ_VERSION: "1.8.1"
          JQ_SHA256: "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d"
          JAQ_VERSION: "2.3.0"
          JAQ_SHA256: "099b8bb519f5ab4a3dc3c1ddedd50770a9cd8cf64129c8de6353572b6f18007a"
        run: |
          set -euo pipefail
          bin="$(go env GOPATH)/bin"
          mkdir -p "${bin}"
          # The image ships a jq of its own; a pinned one replaces it so the
          # version in the report is the version in this file.
          curl -fsSL -o "${RUNNER_TEMP}/jq" \
            "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64"
          echo "${JQ_SHA256}  ${RUNNER_TEMP}/jq" | sha256sum --check -
          install -m 0755 "${RUNNER_TEMP}/jq" "${bin}/jq"
          # jaq is written in Rust, so it comes from a release binary rather
          # than from go install.
          curl -fsSL -o "${RUNNER_TEMP}/jaq" \
            "https://github.com/01mf02/jaq/releases/download/v${JAQ_VERSION}/jaq-x86_64-unknown-linux-gnu"
          echo "${JAQ_SHA256}  ${RUNNER_TEMP}/jaq" | sha256sum --check -
          install -m 0755 "${RUNNER_TEMP}/jaq" "${bin}/jaq"
          go install github.com/itchyny/gojq/cmd/gojq@v0.12.17
      - name: Measure the JSON processors
        run: >
          "$RUNNER_TEMP/himorime" run bench/thirdparty/json
          --format json --output "$RUNNER_TEMP/json.json"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Check the compression tools
        run: |
          gzip --version
          bzip2 --version
          xz --version
      - name: Measure the compression tools
        run: >
          "$RUNNER_TEMP/himorime" run bench/thirdparty/compression
          --format json --output "$RUNNER_TEMP/compression.json"
          --summary "$GITHUB_STEP_SUMMARY"
      # GNU grep comes from the pinned image, like the compression tools.
      # ripgrep is a Rust release binary with a pinned version and SHA256.
      - name: Install ripgrep
        env:
          RG_VERSION: "15.2.0"
          RG_SHA256: "33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
        run: |
          set -euo pipefail
          bin="$(go env GOPATH)/bin"
          mkdir -p "${bin}"
          archive="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${archive}.tar.gz"
          echo "${RG_SHA256}  ${RUNNER_TEMP}/${archive}.tar.gz" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}.tar.gz" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/${archive}/rg" "${bin}/rg"
          grep --version
          rg --version
      - name: Measure the search tools
        run: >
          "$RUNNER_TEMP/himorime" run bench/thirdparty/search
          --format json --output "$RUNNER_TEMP/search.json"
          --summary "$GITHUB_STEP_SUMMARY"
      # cp and rsync come from the pinned image, like the compression tools.
      - name: Check the copy tools
        run: |
          cp --version
          rsync --version
      - name: Measure the copy tools
        run: >
          "$RUNNER_TEMP/himorime" run bench/thirdparty/copy
          --format json --output "$RUNNER_TEMP/copy.json"
          --summary "$GITHUB_STEP_SUMMARY"
      # Miller is a Go module pinned through go install. qsv and xan are Rust
      # release archives with a pinned version and SHA256; the qsv archive
      # also holds qsvlite and qsvdp, which are not installed.
      - name: Install the CSV processors
        env:
          QSV_VERSION: "23.0.1"
          QSV_SHA256: "e4175df7ecb74b91b5b481ffb96f5adbd7e9ea129c1954bfb280b21cba325433"
          XAN_VERSION: "0.61.0"
          XAN_SHA256: "04e4bb7da4345a9e39cd64b1c91c5b48eab9986b0e53981d425fe0ddd6019dae"
        run: |
          set -euo pipefail
          bin="$(go env GOPATH)/bin"
          mkdir -p "${bin}"
          go install github.com/johnkerl/miller/v6/cmd/mlr@v6.21.0
          curl -fsSL -o "${RUNNER_TEMP}/qsv.zip" \
            "https://github.com/dathere/qsv/releases/download/${QSV_VERSION}/qsv-${QSV_VERSION}-x86_64-unknown-linux-musl.zip"
          echo "${QSV_SHA256}  ${RUNNER_TEMP}/qsv.zip" | sha256sum --check -
          unzip -o -q "${RUNNER_TEMP}/qsv.zip" qsv -d "${RUNNER_TEMP}/qsv"
          install -m 0755 "${RUNNER_TEMP}/qsv/qsv" "${bin}/qsv"
          curl -fsSL -o "${RUNNER_TEMP}/xan.tar.gz" \
            "https://github.com/medialab/xan/releases/download/${XAN_VERSION}/xan-x86_64-unknown-linux-musl.tar.gz"
          echo "${XAN_SHA256}  ${RUNNER_TEMP}/xan.tar.gz" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/xan.tar.gz" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/xan" "${bin}/xan"
          mlr --version
          qsv --version
          xan --version
      - name: Measure the CSV processors
        run: >
          "$RUNNER_TEMP/himorime" run bench/thirdparty/csv
          --format json --output "$RUNNER_TEMP/csv.json"
          --summary "$GITHUB_STEP_SUMMARY"
      # csvq and sqly are Go modules pinned through go install. DuckDB and
      # trdsql come from release archives with a pinned version and SHA256;
      # trdsql is not installed with go install because a binary built that
      # way reports its version as "devel".
      - name: Install the SQL engines
        env:
          DUCKDB_VERSION: "1.5.5"
          DUCKDB_SHA256: "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05"
          TRDSQL_VERSION: "1.2.3"
          TRDSQL_SHA256: "812d1e81f98b6a8b6e7c5f1d8ef8e451d6ea75a14bd8a72c1c2334d7c78d9305"
        run: |
          set -euo pipefail
          bin="$(go env GOPATH)/bin"
          mkdir -p "${bin}"
          go install github.com/mithrandie/csvq@v1.18.1
          go install github.com/nao1215/sqly@v1.7.0
          curl -fsSL -o "${RUNNER_TEMP}/duckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          echo "${DUCKDB_SHA256}  ${RUNNER_TEMP}/duckdb.zip" | sha256sum --check -
          unzip -o -q "${RUNNER_TEMP}/duckdb.zip" duckdb -d "${RUNNER_TEMP}/duckdb"
          install -m 0755 "${RUNNER_TEMP}/duckdb/duckdb" "${bin}/duckdb"
          archive="trdsql_v${TRDSQL_VERSION}_linux_amd64"
          curl -fsSL -o "${RUNNER_TEMP}/trdsql.zip" \
            "https://github.com/noborus/trdsql/releases/download/v${TRDSQL_VERSION}/${archive}.zip"
          echo "${TRDSQL_SHA256}  ${RUNNER_TEMP}/trdsql.zip" | sha256sum --check -
          unzip -o -q "${RUNNER_TEMP}/trdsql.zip" "${archive}/trdsql" -d "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/${archive}/trdsql" "${bin}/trdsql"
          duckdb --version
          trdsql -version
          csvq --version
          sqly --version
      - name: Measure the SQL engines
        run: >
          "$RUNNER_TEMP/himorime" run bench/thirdparty/sql
          --format json --output "$RUNNER_TEMP/sql.json"
          --summary "$GITHUB_STEP_SUMMARY"
      # GNU diff and git come from the pinned image, like the compression tools.
      - name: Check the diff tools
        run: |
          diff --version
          git --version
      - name: Measure the diff tools
        run: >
          "$RUNNER_TEMP/himorime" run bench/thirdparty/diff
          --format json --output "$RUNNER_TEMP/diff.json"
          --summary "$GITHUB_STEP_SUMMARY"
      # gojq, and the jq that setup uses to normalize the outputs, come from
      # the Install the JSON processors step above. yq is a Go module pinned through go
      # install. yj comes from a release binary with a pinned version and
      # SHA256, because a go install build reports its version as v0.0.0.
      - name: Install the YAML converters
        env:
          YJ_VERSION: "5.1.0"
          YJ_SHA256: "8ce43e40fda9a28221dabc0d7228e2325d1e959cd770487240deb47e02660986"
        run: |
          set -euo pipefail
          bin="$(go env GOPATH)/bin"
          mkdir -p "${bin}"
          go install github.com/mikefarah/yq/v4@v4.53.6
          curl -fsSL -o "${RUNNER_TEMP}/yj" \
            "https://github.com/sclevine/yj/releases/download/v${YJ_VERSION}/yj-linux-amd64"
          echo "${YJ_SHA256}  ${RUNNER_TEMP}/yj" | sha256sum --check -
          install -m 0755 "${RUNNER_TEMP}/yj" "${bin}/yj"
          yq --version
          yj -v
          gojq --version
      - name: Measure the YAML converters
        run: >
          "$RUNNER_TEMP/himorime" run bench/thirdparty/yaml
          --format json --output "$RUNNER_TEMP/yaml.json"
          --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: himorime-thirdparty-reports
          path: ${{ runner.temp }}/*.json
          retention-days: 7
