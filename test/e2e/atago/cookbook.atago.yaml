# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/atago/main/schema/atago.schema.json
version: "1"

suite:
  name: himorime cookbook

# One scenario per recipe on the Cookbook page, named exactly like the
# recipe's heading; internal/docgen fails when the two drift apart. Each
# scenario runs the recipe's example suite from the repository
# (HIMORIME_REPO, set by test/e2e/run) and checks what the recipe says to
# expect. Recipes that compare Git revisions copy the example into a scratch
# repository, so the himorime checkout itself is never modified.
defaults:
  scenario:
    env:
      GIT_AUTHOR_NAME: himorime-e2e
      GIT_AUTHOR_EMAIL: e2e@example.com
      GIT_COMMITTER_NAME: himorime-e2e
      GIT_COMMITTER_EMAIL: e2e@example.com
      GIT_CONFIG_NOSYSTEM: "1"

scenarios:
  - name: Protect the startup latency of a CLI
    steps:
      - run:
          command: himorime run --quiet --format json ${env:HIMORIME_REPO}/examples/startup
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].result", equals: "pass"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets", length: 2}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].metric", equals: "latency"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].aggregation", equals: "median"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[1].aggregation", equals: "p95"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[1].status", equals: "pass"}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.count", equals: 20}

  - name: Protect the throughput of large CSV and JSON processing
    steps:
      - run:
          command: himorime run --quiet --format json ${env:HIMORIME_REPO}/examples/throughput
          timeout: 300s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.summary.pass", equals: 2}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.throughput.unit", equals: "bytes/s"}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.throughput.stats.median", gte: 5242880}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].operator", equals: ">="}
              - {path: "$.suites[0].benchmarks[1].commands[0].head.metrics.throughput.unit", equals: "records/s"}
              - {path: "$.suites[0].benchmarks[1].commands[0].head.metrics.throughput.work.value", equals: 200000}

  - name: Detect a CPU time regression
    steps:
      - fixture: {file: repo/go.mod, from: ../../../go.mod}
      - fixture: {file: repo/go.sum, from: ../../../go.sum}
      - fixture: {file: repo/examples/tools/wordcount/main.go, from: ../../../examples/tools/wordcount/main.go}
      - fixture: {file: repo/examples/cpu-regression/himorime.yaml, from: ../../../examples/cpu-regression/himorime.yaml}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      # Shrink the read buffer from 64KiB to bufio's 16-byte minimum: counting
      # the same input now takes thousands of times more read calls, which is
      # system CPU time.
      - run:
          command: e2ehelper replace examples/tools/wordcount/main.go "64*1024" "16"
          cwd: repo
      - assert: {exit_code: 0}
      - run:
          command: himorime compare --against main --quiet --format json examples/cpu-regression
          cwd: repo
          timeout: 600s
      - assert:
          exit_code: 1
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.cpu_total.verdict", equals: "regression"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.cpu_total.change_percent", gt: 20}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.cpu_total.min_difference", equals: 5000000}
              - {path: "$.suites[0].benchmarks[0].commands[0].result", equals: "regression"}
              - {path: "$.git.dirty", equals: true}
      - run: {command: git worktree list --porcelain, cwd: repo}
      - assert:
          stdout: {count: 1, contains: "worktree "}

  - name: Detect a peak RSS regression
    steps:
      - fixture: {file: repo/go.mod, from: ../../../go.mod}
      - fixture: {file: repo/go.sum, from: ../../../go.sum}
      - fixture: {file: repo/examples/tools/wordcount/main.go, from: ../../../examples/tools/wordcount/main.go}
      - fixture: {file: repo/examples/memory-regression/himorime.yaml, from: ../../../examples/memory-regression/himorime.yaml}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      # Read the whole input into memory by default instead of streaming it.
      - run:
          # Single quotes group an argument that contains double quotes the
          # same way on every OS.
          command: "e2ehelper replace examples/tools/wordcount/main.go 'defaultImpl = \"scanner\"' 'defaultImpl = \"readall\"'"
          cwd: repo
      - assert: {exit_code: 0}
      - run:
          command: himorime compare --against main --quiet --format json examples/memory-regression
          cwd: repo
          timeout: 600s
      - assert:
          exit_code: 1
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.peak_rss.verdict", equals: "regression"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.peak_rss.unit", equals: "bytes"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.peak_rss.difference", gt: 4194304}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].status", equals: "pass"}

  - name: Compare similar CLIs on the same input
    steps:
      - run:
          command: himorime run --quiet --format json ${env:HIMORIME_REPO}/examples/compare-clis
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands", length: 3}
              - {path: "$.suites[0].benchmarks[0].commands[0].relative.vs_baseline", equals: 1}
              - {path: "$.suites[0].benchmarks[0].commands[2].name", equals: "git-hash"}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.peak_rss.status", equals: "measured"}
              - {path: "$.suites[0].benchmarks[0].commands[1].head.metrics.cpu_total.status", equals: "measured"}
              - {path: "$.suites[0].benchmarks[0].commands[2].head.metrics.cpu_total.status", equals: "measured"}
              - {path: "$.summary.pass", equals: 3}

  - name: Compare the Git base and head on every metric
    steps:
      - fixture: {file: repo/go.mod, from: ../../../go.mod}
      - fixture: {file: repo/go.sum, from: ../../../go.sum}
      - fixture: {file: repo/examples/tools/wordcount/main.go, from: ../../../examples/tools/wordcount/main.go}
      - fixture: {file: repo/examples/git-compare/himorime.yaml, from: ../../../examples/git-compare/himorime.yaml}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      # An uncommitted change that does not affect speed.
      - fixture: {file: repo/NOTES.md, content: "work in progress\n"}
      - run:
          command: himorime compare --against main examples/git-compare
          cwd: repo
          timeout: 300s
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^count 50k lines +\\S+ +\\S+ +\\S+ +[+-][0-9.]+% +\\S+ +\\+10% +(PASS|INCONCLUSIVE)$"
      - assert:
          stdout:
            contains: ["latency\nBENCHMARK", "throughput\nBENCHMARK", "cpu total\nBENCHMARK", "peak rss\nBENCHMARK", "MiB/s"]
      - assert:
          stdout:
            matches: "(?m)^count 50k lines +[0-9.]+MiB/s +[0-9.]+MiB/s +\\S+ +[+-][0-9.]+% +\\S+ +-10% +(PASS|INCONCLUSIVE|IMPROVED)$"
      - assert:
          stderr: {contains: "including uncommitted changes"}
      - run: {command: git status --porcelain, cwd: repo}
      - assert:
          stdout: {equals: "?? NOTES.md\n"}
      - run: {command: git worktree list --porcelain, cwd: repo}
      - assert:
          stdout: {count: 1, contains: "worktree "}

  - name: Compare a script-based CLI without a build step
    # The recipe runs its script with sh.
    skip: {os: windows}
    steps:
      - fixture: {file: repo/examples/script-compare/himorime.yaml, from: ../../../examples/script-compare/himorime.yaml}
      - fixture: {file: repo/examples/script-compare/work.sh, from: ../../../examples/script-compare/work.sh}
      - fixture: {file: repo/examples/script-compare/testdata/records.txt, from: ../../../examples/script-compare/testdata/records.txt}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime compare --against main --quiet examples/script-compare
          cwd: repo
          timeout: 120s
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^count records +\\S+ +\\S+ +\\S+ +[+-][0-9.]+% +\\S+ +\\+20% +(PASS|INCONCLUSIVE)$"
      # Only the working tree's script gets slower. With no build, the base
      # revision still runs its own script, so the change is a regression.
      - run:
          command: e2ehelper replace examples/script-compare/work.sh "count=0" "sleep 0.3; count=0"
          cwd: repo
      - assert: {exit_code: 0}
      - run:
          command: himorime compare --against main --quiet --format json examples/script-compare
          cwd: repo
          timeout: 180s
      # The medians show that each revision ran its own script. A shared
      # runner can be too noisy for a verdict, which is inconclusive and
      # exits 0, never a pass.
      - assert:
          exit_code: {in: [0, 1]}
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.verdict", matches: "^(regression|inconclusive)$"}
              - {path: "$.suites[0].benchmarks[0].commands[0].base.metrics.latency.stats.median", lt: 250000000}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.latency.stats.median", gte: 300000000}
      - run: {command: git status --porcelain, cwd: repo}
      - assert:
          stdout: {equals: " M examples/script-compare/work.sh\n"}

  - name: Gate on CPU time and memory, report latency only
    steps:
      - fixture: {file: repo/go.mod, from: ../../../go.mod}
      - fixture: {file: repo/go.sum, from: ../../../go.sum}
      - fixture: {file: repo/examples/tools/sleepy/main.go, from: ../../../examples/tools/sleepy/main.go}
      - fixture: {file: repo/examples/gate-cpu-memory/himorime.yaml, from: ../../../examples/gate-cpu-memory/himorime.yaml}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      # The program now waits 200ms instead of 10ms: slower, but no more CPU
      # time or memory.
      - run:
          command: e2ehelper replace examples/tools/sleepy/main.go "time.Sleep(d)" "time.Sleep(d + 190*time.Millisecond)"
          cwd: repo
      - assert: {exit_code: 0}
      - run:
          command: himorime compare --against main --quiet --format json examples/gate-cpu-memory
          cwd: repo
          timeout: 600s
      # A shared runner can be too noisy for a latency verdict, and Windows
      # accounts CPU time in clock ticks too coarse for a program this short:
      # those comparisons are inconclusive. Either way the latency is not
      # gated and nothing fails the run.
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.verdict", matches: "^(regression|inconclusive)$"}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.latency.gate", equals: false}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.cpu_total.gate", equals: true}
              - {path: "$.suites[0].benchmarks[0].commands[0].comparisons.peak_rss.gate", equals: true}
              - {path: "$.suites[0].benchmarks[0].commands[0].result", matches: "^(pass|inconclusive)$"}
              - {path: "$.summary.regression", equals: 0}
              - {path: "$.summary.exit_code", equals: 0}
      - run:
          command: himorime compare --against main --quiet examples/gate-cpu-memory
          cwd: repo
          timeout: 600s
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^wait for input +.* (REGRESSION|INCONCLUSIVE) \\(NOT GATED\\)$"
      - assert:
          stdout: {matches: "not gated: 1 (regressed|inconclusive)"}

  - name: Fail a GitHub Actions job when a performance budget is violated
    env:
      GITHUB_ACTIONS: "true"
      GITHUB_EVENT_NAME: pull_request
      GITHUB_EVENT_PATH: ${workdir}/event.json
      GITHUB_STEP_SUMMARY: ${workdir}/summary.md
    steps:
      - fixture: {file: repo/go.mod, from: ../../../go.mod}
      - fixture: {file: repo/go.sum, from: ../../../go.sum}
      - fixture: {file: repo/examples/tools/wordcount/main.go, from: ../../../examples/tools/wordcount/main.go}
      - fixture: {file: repo/examples/github-actions/himorime.yaml, from: ../../../examples/github-actions/himorime.yaml}
      - fixture: {file: repo/.github/workflows/benchmark.yml, from: ../../../examples/github-actions/benchmark.yml}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run: {command: "e2ehelper event pull_request ${workdir}/repo ${workdir}/event.json"}
      - assert:
          file:
            path: repo/.github/workflows/benchmark.yml
            contains: ["pull_request:", "contents: read", "fetch-depth: 0", "run: himorime ci"]
      - assert:
          file:
            path: repo/.github/workflows/benchmark.yml
            not_contains: ["pull_request_target:", "${{ secrets"]
      # The same suite, without a base revision, checks the budgets locally.
      - run:
          command: himorime run --quiet --format json examples/github-actions
          cwd: repo
          timeout: 300s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets", length: 4}
              - {path: "$.summary.over_budget", equals: 0}
      - run:
          command: himorime ci examples/github-actions
          cwd: repo
          timeout: 300s
      - assert:
          exit_code: 0
          stdout:
            not_contains: "\x1b["
      - assert:
          file:
            path: summary.md
            contains: ["himorime benchmark comparison", "| count 50k lines | wordcount |", "#### Throughput", "#### Peak RSS", "#### Budgets (head)"]
      # A budget the change cannot meet fails the job with exit 1 and an
      # annotation that names a performance problem, not a broken run.
      - run:
          command: 'e2ehelper replace examples/github-actions/himorime.yaml "<= 256MiB" "<= 1KiB"'
          cwd: repo
      - run:
          command: himorime ci --quiet examples/github-actions
          cwd: repo
          timeout: 300s
      - assert:
          exit_code: 1
          stderr:
            contains:
              - "::error file=examples/github-actions/himorime.yaml,title=himorime%3A performance budget exceeded::count 50k lines / wordcount: peak rss max budget <= 1.00KiB, measured"
              - "himorime: exit 1: performance check failed"
            not_contains: "could not"

  - name: Save JSON, CSV and Markdown reports locally
    steps:
      - run:
          command: himorime run --quiet --format json --output ${workdir}/result.json ${env:HIMORIME_REPO}/examples/reports
          timeout: 180s
      - assert:
          exit_code: 0
          stdout: {empty: true}
      - run:
          command: e2ehelper json-schema ${env:HIMORIME_REPO}/schema/report.schema.json ${workdir}/result.json
      - assert:
          exit_code: 0
          stdout: {equals: "valid\n"}
      - assert:
          file:
            path: result.json
            json:
              - {path: "$.schema_version", equals: "1"}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.latency.samples", length: 10}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.peak_rss.samples", length: 10}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.throughput.unit", equals: "lines/s"}
              - {path: "$.suites[0].benchmarks[0].commands[1].relative.vs_fastest", gte: 1}
      - run:
          command: himorime run --quiet --format csv --output ${workdir}/result.csv ${env:HIMORIME_REPO}/examples/reports
          timeout: 180s
      - run:
          command: e2ehelper csv-shape ${workdir}/result.csv
      - assert:
          exit_code: 0
          stdout: {matches: "^rows=[0-9]+ columns=29\n$"}
      - assert:
          file:
            path: result.csv
            contains:
              - "suite,benchmark,command,result,record,side,metric,unit,scope,source,process_aggregation,status,statistic,value"
              - "reports,count 20k lines,scanner,pass,stat,head,latency,ns,wall_clock,wall_clock,none,measured,count,10,"
              - "reports,count 20k lines,readall,pass,stat,head,peak_rss,bytes,process_tree,"
              - "reports,count 20k lines,readall,pass,stat,head,cpu_utilization,percent,process_tree,"
      - run:
          command: himorime run --quiet --format samples-csv --output ${workdir}/samples.csv ${env:HIMORIME_REPO}/examples/reports
          timeout: 180s
      - run:
          command: e2ehelper csv-shape ${workdir}/samples.csv
      - assert:
          # A header and 10 runs of 7 metrics for each of 2 commands.
          stdout: {equals: "rows=141 columns=8\n"}
      - run:
          command: himorime run --quiet --format markdown --output ${workdir}/result.md --summary ${workdir}/summary.md ${env:HIMORIME_REPO}/examples/reports
          timeout: 180s
      - assert:
          exit_code: 0
      - assert:
          file:
            path: result.md
            contains:
              - "## reports"
              - "### Latency"
              - "| Benchmark | Command | Median | P95 | Mean | Stddev | Min | Max | Runs | Relative |\n"
              - "| count 20k lines | scanner |"
              - "### CPU"
              - "### Memory"
              - "Measured with himorime"
      - assert:
          file:
            path: summary.md
            contains: ["## ✅ himorime benchmarks: no regression", "### reports", "#### Throughput"]

  - name: Understand CPU utilization above 100%
    steps:
      - run:
          command: himorime run --quiet --format json ${env:HIMORIME_REPO}/examples/cpu-utilization
          timeout: 300s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].name", equals: "scanner"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].status", equals: "pass"}
              - {path: "$.suites[0].benchmarks[0].commands[1].name", equals: "parallel"}
              # Four workers on a multi-core runner: well above one CPU.
              - {path: "$.suites[0].benchmarks[0].commands[1].head.metrics.cpu_utilization.stats.median", gt: 100}

  - name: Understand process tree measurement on each OS
    steps:
      - run:
          command: himorime run --quiet --format json ${env:HIMORIME_REPO}/examples/process-tree
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.cpu_total.scope", equals: "process_tree"}
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.cpu_total.stats.median", gte: 40000000}
              # The parent only waits; the CPU time is its children's.
              - {path: "$.suites[0].benchmarks[0].commands[1].head.metrics.cpu_total.stats.median", gte: 100000000}

  - name: Cope with noise on GitHub-hosted runners
    steps:
      - fixture: {file: repo/go.mod, from: ../../../go.mod}
      - fixture: {file: repo/go.sum, from: ../../../go.sum}
      - fixture: {file: repo/examples/tools/sleepy/main.go, from: ../../../examples/tools/sleepy/main.go}
      - fixture: {file: repo/examples/noisy/himorime.yaml, from: ../../../examples/noisy/himorime.yaml}
      - run: {command: git init -q -b main, cwd: repo}
      - run: {command: git add -A, cwd: repo}
      - run: {command: git -c commit.gpgsign=false commit -q -m base, cwd: repo}
      - run:
          command: himorime compare --against main --quiet examples/noisy
          cwd: repo
          timeout: 300s
      - assert:
          exit_code: 0
          stdout:
            contains: ["INCONCLUSIVE", "bimodal / sleepy: inconclusive: measurements are noisier than max_cv"]
      - assert:
          stdout:
            matches: "(?m)^steady +[0-9.]+ms +[0-9.]+ms +\\S+ +[+-][0-9.]+% +\\S+ +\\+20% +(PASS|INCONCLUSIVE)$"
      - run:
          command: himorime compare --against main --quiet --fail-on-inconclusive examples/noisy
          cwd: repo
          timeout: 300s
      - assert:
          exit_code: 1
          stdout: {contains: "INCONCLUSIVE"}

  - name: Handle a metric this platform cannot measure
    steps:
      - run:
          command: himorime run --quiet --format json ${env:HIMORIME_REPO}/examples/unsupported-metrics
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.cpu_total.status", equals: "measured"}
              # Measured on Linux and macOS; unsupported on Windows, where the
              # command starts a child process. Never a failure.
              - {path: "$.suites[0].benchmarks[0].commands[0].head.metrics.peak_rss.status", matches: "^(measured|unsupported)$"}
              - {path: "$.suites[0].benchmarks[0].commands[0].budgets[0].status", matches: "^(pass|skipped)$"}
              - {path: "$.summary.exit_code", equals: 0}

  - name: Compare parsers on a stdin fixture
    steps:
      - run:
          command: himorime run --quiet ${env:HIMORIME_REPO}/examples/stdin-fixture
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            contains: ["access log on stdin", "inline stdin", "geometric mean over 2 cases (relative to the baseline): scanner 1.00x"]

  - name: Compare small, medium and large inputs
    steps:
      - run:
          command: himorime run --quiet --tag smoke ${env:HIMORIME_REPO}/examples/input-sizes
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^small +readall .* PASS$"
            not_contains: "large"
      - run:
          command: himorime run --quiet --runs 3 --format json ${env:HIMORIME_REPO}/examples/input-sizes
          timeout: 300s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks", length: 3}
              - {path: "$.suites[0].geometric_mean.reference", equals: "baseline"}
              - {path: "$.suites[0].geometric_mean.cases", equals: 3}
              - {path: "$.suites[0].geometric_mean.values[0].command", equals: "scanner"}

  - name: Reset state before every run
    steps:
      - run:
          command: himorime run --quiet ${env:HIMORIME_REPO}/examples/prepare-each
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^regenerate then count +wordcount .* PASS$"

  - name: Clean up after success, failure or interruption
    steps:
      - run:
          command: himorime run --quiet ${env:HIMORIME_REPO}/examples/cleanup
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^with cleanup +wordcount .* PASS$"

  - name: Benchmark a warm cache
    steps:
      - run:
          command: himorime run --quiet --format json ${env:HIMORIME_REPO}/examples/cache
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            json:
              - {path: "$.suites[0].benchmarks[0].name", equals: "warm cache"}
              - {path: "$.suites[0].benchmarks[1].name", equals: "cold cache"}
              - {path: "$.summary.pass", equals: 2}

  - name: Run only smoke benchmarks
    steps:
      - run:
          command: himorime run --quiet --tag smoke ${env:HIMORIME_REPO}/examples/tags
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            not_contains: "large input"
      - run:
          command: himorime list --skip-tag slow ${env:HIMORIME_REPO}/examples/tags
      - assert:
          exit_code: 0
          stdout:
            not_contains: "large input"

  - name: Stop a command that hangs
    steps:
      - run:
          command: himorime run --quiet ${env:HIMORIME_REPO}/examples/timeout
          timeout: 180s
      - assert:
          duration: {lt: 120s}
      - assert:
          exit_code: 4
          stdout:
            contains: ["hangs / sleepy: timeout: timed out after 1s and was stopped"]

  - name: Treat a non-zero exit as an error
    steps:
      - run:
          command: himorime run --quiet ${env:HIMORIME_REPO}/examples/failing-command
          timeout: 180s
      - assert:
          exit_code: 4
          stdout:
            contains:
              - "unexpected failure / sleepy: exit code: exited with status 3 (allowed: 0)"
              - "stderr: sleepy: exiting with status 3 as asked"
      - assert:
          stdout:
            matches: "(?m)^expected exit code +sleepy .* PASS$"

  - name: Use a shell pipeline
    steps:
      - run:
          command: himorime run --quiet ${env:HIMORIME_REPO}/examples/shell
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            matches: "(?m)^pipeline +pipeline .* PASS$"

  - name: Understand the geometric mean
    steps:
      - run:
          command: himorime run --quiet ${env:HIMORIME_REPO}/examples/missing-case
          timeout: 180s
      - assert:
          exit_code: 0
          stdout:
            contains: ['no geometric mean: command "readall" is missing from benchmark "large"']
