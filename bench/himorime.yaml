# yaml-language-server: $schema=../schema/himorime.schema.json
#
# himorime measuring itself. .github/workflows/benchmark.yml runs
# `himorime ci bench` on pull requests with a released himorime and fails on a
# confirmed regression; `make bench` runs the suite locally.
version: "1"

suite:
  name: himorime dogfood
  description: Start-up, validation and a small measured run of himorime itself.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..

# The same defaults and tolerances as the suites of the other nao1215 CLIs
# (jsonize, sqly, gup, ...), so a regression means the same thing everywhere.
defaults:
  warmup: 2
  runs: 20
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu:
      max_percent: 15
      min_difference: 2ms
    memory:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    tags: [smoke]
    commands:
      himorime:
        command: ["${artifact}", version]

  - name: validate every example
    commands:
      himorime:
        command:
          - "${artifact}"
          - validate
          - "${root}/../examples/cache"
          - "${root}/../examples/compare-clis"
          - "${root}/../examples/input-sizes"
          - "${root}/../examples/reports"
          - "${root}/../examples/stdin-fixture"

  - name: list with a filter
    commands:
      himorime:
        command: ["${artifact}", list, --format, json, --filter, "^(small|large)$", "${root}/../examples/input-sizes"]

  - name: run a tiny suite
    setup:
      - command: ["${artifact}", init, "${workdir}/tiny.yaml"]
    commands:
      himorime:
        command: ["${artifact}", run, --quiet, --runs, "3", --warmup, "0", --format, json, "${workdir}/tiny.yaml"]

  - name: collector overhead
    description: >-
      The same suite measured with latency only and with every metric. The
      difference is what reading CPU time and peak RSS after each run costs
      himorime; it is never part of a measured run.
    commands:
      latency-only:
        command: ["${artifact}", run, --quiet, --runs, "20", --warmup, "0", --format, json, "${root}/testdata/latency-only.yaml"]
      all-metrics:
        command: ["${artifact}", run, --quiet, --runs, "20", --warmup, "0", --format, json, "${root}/testdata/all-metrics.yaml"]
