# Configuration for the documentation website (GitHub Pages).
# The prose lives here; the README only introduces himorime and links to it.
# Sections marked "BEGIN GENERATED" are rewritten from the code by
# `make docs` and checked by internal/docgen.
baseURL = "https://nao1215.github.io/himorime/"
locale = "en"
title = "himorime"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
timeZone = "UTC"

[params]
tagline = "Performance budgets for command-line programs, in your repository and in CI"
description = "himorime checks whether a CLI stays within its performance budget: latency, throughput, CPU time and peak RSS, measured from a YAML suite, compared with a Git base revision, failing CI on violations."

[markup.highlight]
noClasses = false

